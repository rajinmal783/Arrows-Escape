<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Arrow Escape: Think. Tap. Escape. A production-quality 2D logic puzzle game.">
  <meta name="theme-color" content="#1E3A8A">

  <!-- Open Graph / SEO -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Arrow Escape - Think. Tap. Escape.">
  <meta property="og:description" content="Clear grid mazes, plan arrow escapes, and conquer 500 levels of geometric puzzles.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arrow Escape">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Arrow Escape: Think. Tap. Escape.</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background-color: #0F172A;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0F172A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .brand-box {
      width: 76px;
      height: 76px;
      background: linear-gradient(135deg, #1E3A8A, #2563EB);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
      animation: pulse 2s infinite ease-in-out;
    }
    .brand-arrow {
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 24px solid #FFFFFF;
    }
    .brand-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-top: 24px;
      margin-bottom: 6px;
    }
    .brand-tagline {
      color: #60A5FA;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 32px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="brand-box">
      <div class="brand-arrow"></div>
    </div>
    <div class="brand-title">ARROW ESCAPE</div>
    <div class="brand-tagline">Think. Tap. Escape.</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove loading indicator once Flutter engine attaches
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 400);
      }
    });

    // PWA Install Prompt handler
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.pwaInstallPrompt = deferredPrompt;
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
